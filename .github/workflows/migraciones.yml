# Migraciones de la base de datos con FluentMigrator.
# Levanta un SQL Server 2022 desechable, corre todas las migraciones desde una BD vacía,
# corre los scripts de datos de prueba y de la HU-14, revierte la última (rollback by 1)
# y la vuelve a aplicar. Nunca toca Azure.
#
# Requiere el secret MSSQL_SA_PASSWORD (Settings > Secrets and variables > Actions):
# una contraseña fuerte cualquiera (8+ caracteres con mayúsculas, minúsculas, números y símbolo).
# Solo vive dentro del contenedor de pruebas de cada ejecución.

name: Migraciones BD

on:
  push:
    branches:
      - develop
      - main
      - Sprint4_Adrian
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  migraciones:
    name: Migraciones desde cero, rollback y reaplicación
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    env:
      SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      # La contraseña llega desde el secret; GitHub la oculta en los logs.
      CONN: Server=localhost,1433;Database=GlamSpacesMigraciones;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True
      DLL: GlamSpaces.Migrations/bin/Release/net9.0/GlamSpaces.Migrations.dll
      PROCESADOR: SqlServer2016

    steps:
      - name: Verificar el secret de la contraseña
        run: |
          if [ -z "$SA_PASSWORD" ]; then
            echo "::error::Falta el secret MSSQL_SA_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restaurar la herramienta dotnet-fm (.config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Compilar las migraciones
        run: dotnet build GlamSpaces.Migrations -c Release

      # SQL Server tarda unos segundos en arrancar dentro del contenedor.
      - name: Esperar a que SQL Server acepte conexiones
        run: |
          for intento in $(seq 1 30); do
            if docker exec ${{ job.services.sqlserver.id }} \
                 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server listo (intento $intento)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::SQL Server no respondió a tiempo."
          exit 1

      - name: Crear la base de datos vacía
        run: >
          docker exec ${{ job.services.sqlserver.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b
          -Q "CREATE DATABASE GlamSpacesMigraciones"

      - name: Listar (antes, todo pendiente)
        run: dotnet tool run dotnet-fm -- list migrations -p $PROCESADOR -c "$CONN" -a $DLL

      - name: Aplicar todas las migraciones desde cero
        run: dotnet tool run dotnet-fm -- migrate -p $PROCESADOR -c "$CONN" -a $DLL up

      - name: Listar (después, todo aplicado)
        run: dotnet tool run dotnet-fm -- list migrations -p $PROCESADOR -c "$CONN" -a $DLL

      # Scripts de Database/ que no son migraciones (datos de prueba y semilla de la HU-14).
      # Se copian al contenedor y se corren con sqlcmd (-I = QUOTED_IDENTIFIER ON).
      - name: Copiar los scripts de Database/ al contenedor
        run: docker cp Database/. ${{ job.services.sqlserver.id }}:/tmp/Database

      # La semilla de 06_SolicitudesHU14.sql necesita un salón con paquete y un cliente:
      # 04_DatosPrueba.sql crea los salones y paquetes de prueba; el cliente se agrega aquí.
      - name: Datos de prueba previos a la semilla de la HU-14
        run: |
          docker exec ${{ job.services.sqlserver.id }} \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -I -d GlamSpacesMigraciones \
            -i /tmp/Database/04_DatosPrueba.sql
          docker exec ${{ job.services.sqlserver.id }} \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -I -d GlamSpacesMigraciones \
            -Q "IF NOT EXISTS (SELECT 1 FROM dbo.Usuarios WHERE Correo = 'cliente.prueba@glamspaces.com') INSERT INTO dbo.Usuarios (NombreCompleto, Correo, PasswordHash, TipoCuenta, NombreSalon, FechaRegistro) VALUES ('Cliente de Prueba', 'cliente.prueba@glamspaces.com', 'sin-login', 'cliente', NULL, SYSUTCDATETIME());"

      # Se corren dos veces: la segunda demuestra que son idempotentes (no duplican nada).
      # 07 encuentra la columna que ya agregó la M006 y no hace nada (igual que pasaría en Azure).
      - name: Scripts 06_SolicitudesHU14.sql y 07_TelefonoSolicitudesHU16.sql (dos veces) y verificación de la semilla
        run: |
          for vez in 1 2; do
            for script in 06_SolicitudesHU14.sql 07_TelefonoSolicitudesHU16.sql; do
              docker exec ${{ job.services.sqlserver.id }} \
                /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -I -d GlamSpacesMigraciones \
                -i /tmp/Database/$script
            done
          done
          docker exec ${{ job.services.sqlserver.id }} \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d GlamSpacesMigraciones \
            -Q "IF (SELECT COUNT(*) FROM dbo.Solicitudes) <> 3 OR (SELECT COUNT(DISTINCT Estado) FROM dbo.Solicitudes) <> 3 THROW 50000, 'La semilla de la HU-14 debe dejar 3 solicitudes, una por estado.', 1; PRINT 'OK: 3 solicitudes (pendiente, confirmada, rechazada).';"

      - name: Rollback de la última migración
        run: dotnet tool run dotnet-fm -- rollback -p $PROCESADOR -c "$CONN" -a $DLL by 1

      - name: Verificar que el rollback de la 007 quitó los SP de solicitudes
        run: >
          docker exec ${{ job.services.sqlserver.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d GlamSpacesMigraciones
          -Q "IF OBJECT_ID(N'dbo.sp_Solicitud_Crear', N'P') IS NOT NULL OR OBJECT_ID(N'dbo.sp_Solicitud_Obtener', N'P') IS NOT NULL OR OBJECT_ID(N'dbo.sp_Solicitud_ListarPorCliente', N'P') IS NOT NULL THROW 50000, 'El rollback de la 007 no quitó los SP de solicitudes.', 1; IF COL_LENGTH(N'dbo.Solicitudes', N'TelefonoContacto') IS NULL THROW 50000, 'El rollback de la 007 no debe quitar TelefonoContacto.', 1; IF (SELECT COUNT(*) FROM dbo.Solicitudes) <> 3 THROW 50000, 'El rollback de la 007 no debe borrar solicitudes.', 1; PRINT 'OK: los 3 SP de solicitudes se quitaron; TelefonoContacto y las 3 solicitudes siguen.';"

      - name: Listar (tras el rollback, la 007 queda pendiente)
        run: dotnet tool run dotnet-fm -- list migrations -p $PROCESADOR -c "$CONN" -a $DLL

      - name: Reaplicar
        run: dotnet tool run dotnet-fm -- migrate -p $PROCESADOR -c "$CONN" -a $DLL up

      - name: Verificar que TelefonoContacto volvió, Solicitudes completa y el historial (VersionInfo)
        run: >
          docker exec ${{ job.services.sqlserver.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d GlamSpacesMigraciones
          -Q "IF COL_LENGTH(N'dbo.Solicitudes', N'TelefonoContacto') IS NULL THROW 50000, 'La reaplicación no agregó TelefonoContacto.', 1; IF OBJECT_ID(N'dbo.Solicitudes', N'U') IS NULL THROW 50000, 'Falta la tabla Solicitudes.', 1; IF (SELECT COUNT(*) FROM sys.check_constraints WHERE name IN ('CK_Solicitudes_Invitados', 'CK_Solicitudes_Estado')) <> 2 THROW 50000, 'Faltan restricciones CHECK de Solicitudes.', 1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = 'UX_Solicitudes_Cliente_Salon_Fecha_Pendiente' AND is_unique = 1 AND has_filter = 1) THROW 50000, 'Falta el índice único filtrado de Solicitudes.', 1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = 'UX_BusquedasFavoritas_Usuario_Salon') THROW 50000, 'Falta el índice de la 004.', 1; IF OBJECT_ID(N'dbo.sp_Solicitud_Crear', N'P') IS NULL OR OBJECT_ID(N'dbo.sp_Solicitud_Obtener', N'P') IS NULL OR OBJECT_ID(N'dbo.sp_Solicitud_ListarPorCliente', N'P') IS NULL THROW 50000, 'La reaplicación de la 007 no creó los SP de solicitudes.', 1; PRINT 'OK: TelefonoContacto volvió; Solicitudes con sus 2 CHECK y su índice único filtrado; los 3 SP de solicitudes (sp_Solicitud_Crear, sp_Solicitud_Obtener, sp_Solicitud_ListarPorCliente) existen.'; SELECT Version, AppliedOn, Description FROM dbo.VersionInfo ORDER BY Version;"
