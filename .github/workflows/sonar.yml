# Análisis de calidad de código con SonarQube Cloud.
# Detecta bugs, vulnerabilidades, code smells, duplicación y deuda técnica, y evalúa el Quality Gate.
# Requiere el secret SONAR_TOKEN en GitHub (Settings > Secrets and variables > Actions)
# y tener desactivado "Automatic Analysis" en el proyecto de sonarcloud.io.

name: SonarQube Cloud

on:
  push:
    # Solo main: es la rama principal del proyecto en SonarQube Cloud (análisis completo con
    # cobertura). El plan Free no guarda otras ramas; develop y release se revisan en sus PR.
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Permisos mínimos: solo leer el código y los PR (SonarQube Cloud comenta los PR con su propia app de GitHub).
permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Análisis SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      # Historial completo (sin clon superficial) para que Sonar asigne bien el código nuevo y el blame.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.x'

      # El scanner necesita Java. SonarQube Cloud quitó el soporte de Java 17 el 20/07/2026;
      # ahora exige Java 21 o mayor.
      - name: Instalar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dotnet-sonarscanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # begin → build → test → end: el scanner observa la compilación, las pruebas generan la
      # cobertura (OpenCover, con coverlet) y al final se sube todo.
      # Solo se excluyen bin/ y obj/ (artefactos de compilación); ningún hallazgo del código se oculta.
      # Database/ sale solo de la detección de duplicados (cpd): cada script repite a propósito los SP
      # completos con CREATE OR ALTER para correrse solo en producción. Su cobertura y reglas no cambian.
      # GlamSpaces.Tests se clasifica como código de prueba con <SonarQubeTestProject> en su .csproj
      # (SonarScanner for .NET no admite sonar.test.inclusions).
      - name: Iniciar análisis
        run: >
          dotnet sonarscanner begin
          /k:"4DRIAN-G4RCI4_GlamSpace-Back"
          /o:"4drian-g4rci4"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.exclusions="**/bin/**,**/obj/**"
          /d:sonar.cpd.exclusions="Database/**"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Compilar
        run: dotnet build GlamSpaces.sln

      # Pruebas unitarias sin base de datos (los repositorios se sustituyen por dobles).
      - name: Pruebas unitarias con cobertura
        run: >
          dotnet test GlamSpaces.sln --no-build
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory TestResults

      - name: Terminar análisis y subir resultados
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
