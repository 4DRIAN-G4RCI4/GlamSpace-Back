# Análisis de calidad de código con SonarQube Cloud.
# Detecta bugs, vulnerabilidades, code smells, duplicación y deuda técnica, y evalúa el Quality Gate.
# Requiere el secret SONAR_TOKEN en GitHub (Settings > Secrets and variables > Actions)
# y tener desactivado "Automatic Analysis" en el proyecto de sonarcloud.io.

name: SonarQube Cloud

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Permisos mínimos: solo leer el código y los PR (SonarQube Cloud comenta los PR con su propia app de GitHub).
permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Análisis SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      # Historial completo (sin clon superficial) para que Sonar asigne bien el código nuevo y el blame.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # El scanner necesita Java. SonarQube Cloud quitó el soporte de Java 17 el 20/07/2026;
      # ahora exige Java 21 o mayor.
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dotnet-sonarscanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # begin → build → end: el scanner observa la compilación y al final sube los resultados.
      # Solo se excluyen bin/ y obj/ (artefactos de compilación); ningún hallazgo del código se oculta.
      - name: Iniciar análisis
        run: >
          dotnet sonarscanner begin
          /k:"4drian-g4rci4_GlamSpace-Back"
          /o:"4drian-g4rci4"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.exclusions="**/bin/**,**/obj/**"

      - name: Compilar
        run: dotnet build GlamSpaces.sln

      - name: Terminar análisis y subir resultados
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
